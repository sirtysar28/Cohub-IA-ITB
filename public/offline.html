<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — CoHub IA ITB Jatim</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 60%, #6366f1 100%);
            color: #fff; padding: 1.5rem; text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, .08); backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .15); border-radius: 1.5rem;
            padding: 3rem 2rem; max-width: 28rem; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .4);
            animation: up .6s cubic-bezier(.22, .61, .36, 1) both;
        }
        @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
        .icon { font-size: 4rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(8px); } }
        h1 { font-size: 1.5rem; font-weight: 800; margin: 1rem 0 .5rem; }
        p { opacity: .85; font-size: .95rem; line-height: 1.6; }
        .logo { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 1rem; }
        button {
            margin-top: 1.75rem; background: #fff; color: #4f46e5; border: 0; cursor: pointer;
            font-weight: 700; font-size: .95rem; padding: .8rem 1.75rem; border-radius: .9rem;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, .35); }
        button:active { transform: scale(.96); }
        .hint { margin-top: 1.25rem; font-size: .78rem; opacity: .6; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="CoHub" class="logo">
        <div class="icon">📡</div>
        <h1>Kamu Sedang Offline</h1>
        <p>
            Koneksi internet terputus. Halaman yang pernah kamu buka masih bisa diakses,
            tapi untuk data terbaru silakan sambungkan kembali internet kamu.
        </p>
        <button onclick="location.reload()">🔄 Coba Lagi</button>
        <p class="hint">CoHub IA ITB Jatim — Progressive Web App</p>
    </div>
</body>
</html>
